name: Verify project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r dashboard/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
