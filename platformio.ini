; Optional: Use PlatformIO IDE extension in VS Code to compile & upload.
; Canonical firmware is firmware/Room304/Room304.ino.
[platformio]
src_dir = firmware/Room304

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
