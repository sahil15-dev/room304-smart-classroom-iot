<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="795" viewBox="0 0 1600 795"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0b1729"/><stop offset="100%" stop-color="#0f233b"/></linearGradient><linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#47e0c1"/><stop offset="100%" stop-color="#4fa3eb"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#304b67" opacity=".26" stroke-width="1" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="68" y="85" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="43" text-anchor="start" letter-spacing="0">SYSTEM ARCHITECTURE</text><text x="68" y="126" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" font-size="19" text-anchor="start" letter-spacing="0">A low-voltage observational system: sensing, local decisions, cloud history and web monitoring</text><rect x="70" y="180" width="297" height="410" rx="26" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><rect x="91" y="200" width="150" height="36" rx="18" fill="#16344a" stroke="#3be0d1" stroke-width="1" opacity="0.9"/><text x="166.0" y="224" fill="#3be0d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">SENSORS</text><text x="92" y="266" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Environmental inputs</text><rect x="426" y="180" width="321" height="410" rx="26" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><rect x="447" y="200" width="150" height="36" rx="18" fill="#16344a" stroke="#55aaff" stroke-width="1" opacity="0.9"/><text x="522.0" y="224" fill="#55aaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">ARDUINO UNO</text><text x="448" y="266" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Embedded control</text><rect x="816" y="180" width="322" height="410" rx="26" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><rect x="837" y="200" width="156" height="36" rx="18" fill="#16344a" stroke="#ac93fc" stroke-width="1" opacity="0.9"/><text x="915.0" y="224" fill="#ac93fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">PYTHON BRIDGE</text><text x="838" y="266" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">USB serial gateway</text><rect x="1222" y="180" width="310" height="410" rx="26" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><rect x="1243" y="200" width="150" height="36" rx="18" fill="#16344a" stroke="#ffb66d" stroke-width="1" opacity="0.9"/><text x="1318.0" y="224" fill="#ffb66d" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">THINGSPEAK</text><text x="1244" y="266" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Private channel</text><text x="94" y="312" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Temperature &amp; humidity</text><text x="94" y="356" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Light (A0)</text><text x="94" y="400" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Sound activity (A1)</text><text x="94" y="444" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Door contact (D3)</text><text x="94" y="488" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">PIR motion (D7)</text><text x="94" y="532" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Mode button (D4)</text><text x="450" y="310" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750" font-size="25" text-anchor="start" letter-spacing="0">Sample &amp; validate</text><text x="450" y="351" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="22" text-anchor="start" letter-spacing="0">Apply warning rules</text><text x="450" y="400" fill="#3be0d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="22" text-anchor="start" letter-spacing="0">RGB LED  /  buzzer</text><text x="450" y="452" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="22" text-anchor="start" letter-spacing="0">DATA at 9600 baud</text><text x="450" y="496" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">~2.5 s sensor report</text><text x="841" y="310" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="22" text-anchor="start" letter-spacing="0">Read serial COM port</text><text x="841" y="352" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" letter-spacing="0">Validate eight fields</text><text x="841" y="394" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" letter-spacing="0">Append local CSV</text><text x="841" y="436" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" letter-spacing="0">Upload every ~20 s</text><text x="841" y="499" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="17" text-anchor="start" letter-spacing="0">Write key stays on laptop</text><text x="1246" y="311" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="23" text-anchor="start" letter-spacing="0">8 sensor fields</text><text x="1246" y="358" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" letter-spacing="0">Timestamped history</text><text x="1246" y="404" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" letter-spacing="0">Read-only cloud API</text><text x="1246" y="459" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Private Read API key</text><line x1="371" y1="386" x2="422" y2="386" stroke="#3be0d1" stroke-width="4" stroke-linecap="round"/><path d="M 412 379 L 422 386 L 412 393" stroke="#3be0d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="751" y1="386" x2="802" y2="386" stroke="#3be0d1" stroke-width="4" stroke-linecap="round"/><path d="M 792 379 L 802 386 L 792 393" stroke="#3be0d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="1143" y1="386" x2="1194" y2="386" stroke="#3be0d1" stroke-width="4" stroke-linecap="round"/><path d="M 1184 379 L 1194 386 L 1184 393" stroke="#3be0d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="1375" y1="594" x2="1375" y2="638" stroke="#55aaff" stroke-width="4" stroke-linecap="round"/><line x1="1375" y1="638" x2="920" y2="638" stroke="#55aaff" stroke-width="4" stroke-linecap="round"/><line x1="920" y1="638" x2="920" y2="654" stroke="#55aaff" stroke-width="4" stroke-linecap="round"/><rect x="645" y="658" width="580" height="96" rx="23" fill="#153651" stroke="#48b5dc" stroke-width="2" opacity="1"/><text x="935" y="698" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="middle" letter-spacing="0">RENDER  /  FLASK DASHBOARD</text><text x="935" y="732" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="450" font-size="18" text-anchor="middle" letter-spacing="0">Read-only web view • recent / stale status • history</text><text x="68" y="781" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="17" text-anchor="start" letter-spacing="0">No direct mains/HVAC control. PIR and sound are activity clues, not confirmed occupancy.</text></svg>