 dashboard</text><text x="64" y="835" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#9AABC0" >Website status and local LED/buzzer are the current alerts. No remote mains/HVAC control. PIR is planned, not installed.</text></svg>