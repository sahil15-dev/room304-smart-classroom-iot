<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="645" viewBox="0 0 1600 645"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0b1729"/><stop offset="100%" stop-color="#0f233b"/></linearGradient><linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#47e0c1"/><stop offset="100%" stop-color="#4fa3eb"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#304b67" opacity=".26" stroke-width="1" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="68" y="85" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="43" text-anchor="start" letter-spacing="0">ALERT STATES</text><text x="68" y="126" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" font-size="19" text-anchor="start" letter-spacing="0">The firmware controls the physical RGB LED and short buzzer indication</text><rect x="70" y="192" width="423" height="339" rx="27" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><circle cx="148" cy="269" r="38" fill="#57dfb0" opacity=".25"/><circle cx="148" cy="269" r="21" fill="#57dfb0"/><text x="205" y="273" fill="#57dfb0" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" font-size="25" text-anchor="start" letter-spacing="0">00</text><text x="101" y="345" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="30" text-anchor="start" letter-spacing="0">NORMAL</text><text x="101" y="390" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="17" text-anchor="start" letter-spacing="0">Within configured rules</text><text x="101" y="457" fill="#57dfb0" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="680" font-size="18" text-anchor="start" letter-spacing="0">Green LED · no warning</text><rect x="587" y="192" width="423" height="339" rx="27" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><circle cx="665" cy="269" r="38" fill="#55aaff" opacity=".25"/><circle cx="665" cy="269" r="21" fill="#55aaff"/><text x="722" y="273" fill="#55aaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" font-size="25" text-anchor="start" letter-spacing="0">01</text><text x="618" y="345" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="30" text-anchor="start" letter-spacing="0">COMFORT</text><text x="618" y="390" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="17" text-anchor="start" letter-spacing="0">Temperature or humidity</text><text x="618" y="457" fill="#55aaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="680" font-size="18" text-anchor="start" letter-spacing="0">Blue LED · warning</text><rect x="1104" y="192" width="423" height="339" rx="27" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><circle cx="1182" cy="269" r="38" fill="#ff728e" opacity=".25"/><circle cx="1182" cy="269" r="21" fill="#ff728e"/><text x="1239" y="273" fill="#ff728e" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" font-size="25" text-anchor="start" letter-spacing="0">02</text><text x="1135" y="345" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="30" text-anchor="start" letter-spacing="0">LIGHTING</text><text x="1135" y="390" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="17" text-anchor="start" letter-spacing="0">Bright + expected empty + quiet</text><text x="1135" y="457" fill="#ff728e" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="680" font-size="18" text-anchor="start" letter-spacing="0">Red LED · verify room</text><text x="72" y="596" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Alert 03 (DHT sensor fault) also uses red. A sound span is a relative amplitude value, not decibels.</text></svg>