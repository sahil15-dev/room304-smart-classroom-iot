<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="Arduino UNO proposed pin-to-module connections"><rect width="1180" height="800" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="590" y="52" text-anchor="middle" font-size="29" font-weight="700" fill="#17395a">Room 304 | Arduino UNO Wiring Reference</text><text x="590" y="82" text-anchor="middle" font-size="16" fill="#5d7184">Connection blueprint only: confirm each module's VCC/GND/S markings on real hardware</text><rect x="440" y="135" width="300" height="540" rx="15" fill="#deedff" stroke="#7ca9d7" stroke-width="2"/><text x="590.0" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#16365c">Arduino UNO R3</text><text x="590.0" y="197" text-anchor="middle" font-size="14" fill="#49647e">USB to laptop</text><rect x="35" y="155" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D2  -&gt;  Temp + humidity</text><path d="M360 186 L440 186" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="35" y="245" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D3  -&gt;  Mini Reed switch</text><path d="M360 276 L440 276" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="35" y="335" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D4  -&gt;  Mode button</text><path d="M360 366 L440 366" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="35" y="425" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D5  -&gt;  Active buzzer</text><path d="M360 456 L440 456" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="35" y="515" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D6  -&gt;  RGB red</text><path d="M360 546 L440 546" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="35" y="605" width="325" height="62" rx="15" fill="#fff1f1" stroke="#bbd0e8" stroke-width="2"/><text x="197.5" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D7  -&gt;  PIR: not connected</text><path d="M360 636 L440 636" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="155" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D9  -&gt;  RGB green</text><path d="M740 186 L820 186" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="245" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">D10  -&gt;  RGB blue</text><path d="M740 276 L820 276" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="335" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">A0  -&gt;  Photoresistor AO</text><path d="M740 366 L820 366" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="425" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">A1  -&gt;  Big Sound AO</text><path d="M740 456 L820 456" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="515" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">5V  -&gt;  Rated module VCC</text><path d="M740 546 L820 546" stroke="#6986a2" stroke-width="2.4" fill="none"/><rect x="820" y="605" width="325" height="62" rx="15" fill="#f0f7ff" stroke="#bbd0e8" stroke-width="2"/><text x="982.5" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#16365c">GND  -&gt;  All module grounds</text><path d="M740 636 L820 636" stroke="#6986a2" stroke-width="2.4" fill="none"/><text x="590" y="739" text-anchor="middle" font-size="15" fill="#526d86">No mains-voltage connections. Bare RGB LEDs need resistors per channel.</text><text x="590" y="764" text-anchor="middle" font-size="15" fill="#526d86">DHT type, reed/button polarity, light direction and buzzer logic may require calibration in config.h.</text></g></svg>