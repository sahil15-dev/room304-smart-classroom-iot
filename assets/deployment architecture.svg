<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1527"/><stop offset="1" stop-color="#142339"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46E3C9"/><stop offset="1" stop-color="#4A9FE8"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#53D9C6"/></marker></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="65" y="70" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#F4F7FC" >Two ways to view Room 304</text><text x="65" y="108" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#9AABC0" >One codebase. Two deployment modes. No simulated live readings.</text><rect x="65" y="185" width="694" height="562" rx="28" fill="#111D32" stroke="#38647A" stroke-width="1.4" /><text x="100" y="245" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="26" font-weight="800" text-anchor="start" fill="#40D8C3" >LOCAL • LAB MODE</text><rect x="105" y="294" width="614" height="93" rx="18" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="133" y="331" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#F4F7FC" >Arduino UNO</text><text x="133" y="360" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#9AABC0" >Sensor data and LED/buzzer</text><path d="M411 388 V419" fill="none" stroke="#40D8C3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="105" y="426" width="614" height="93" rx="18" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="133" y="463" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#F4F7FC" >Laptop Python bridge</text><text x="133" y="492" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#9AABC0" >Owns COM port and writes CSV</text><path d="M411 520 V551" fill="none" stroke="#40D8C3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="105" y="558" width="614" height="93" rx="18" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="133" y="595" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#F4F7FC" >Flask dashboard</text><text x="133" y="624" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#9AABC0" >Reads local CSV + ThingSpeak</text><rect x="829" y="185" width="705" height="562" rx="28" fill="#111D32" stroke="#38647A" stroke-width="1.4" /><text x="861" y="245" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="26" font-weight="800" text-anchor="start" fill="#60D9AD" >ONLINE • SHOWCASE MODE</text><rect x="864" y="302" width="294" height="111" rx="17" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="886" y="342" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#F4F7FC" >GitHub repository</text><text x="886" y="367" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#9AABC0" >Push website updates</text><text x="886" y="390" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#40D8C3" >Auto-deploy source code</text><rect x="1178" y="302" width="320" height="111" rx="17" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="1200" y="342" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#F4F7FC" >Private ThingSpeak</text><text x="1200" y="367" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#9AABC0" >Stored sensor readings</text><text x="1200" y="390" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#60D9AD" >Server-side Read key</text><rect x="864" y="479" width="634" height="101" rx="17" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="889" y="520" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#F4F7FC" >Render web service</text><text x="889" y="548" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#9AABC0" >Reads ThingSpeak and serves website; no COM port</text><rect x="864" y="637" width="634" height="66" rx="17" fill="#14273D" stroke="#2C536A" stroke-width="1.4" /><text x="889" y="663" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#F4F7FC" >Professor / portfolio browser</text><text x="889" y="686" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#9AABC0" >Online, read-only; stale badge if bridge stops</text><path d="M1011 413 V450 H1065 V466" fill="none" stroke="#40D8C3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1336 413 V450 H1230 V466" fill="none" stroke="#40D8C3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1181 580 V627" fill="none" stroke="#40D8C3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="790" width="1469" height="69" rx="18" fill="#1B2C35" stroke="#42736C" stroke-width="1.4" /><text x="102" y="817" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#F6CD78" >IMPORTANT</text><text x="240" y="819" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#F4F7FC" >Render does not connect to Arduino. ThingSpeak only updates while the laptop bridge is active.</text><text x="240" y="846" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#9AABC0" >Free Render can sleep when idle; paid always-on hosting is optional.</text></svg>