<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0b1729"/><stop offset="100%" stop-color="#0f233b"/></linearGradient><linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#47e0c1"/><stop offset="100%" stop-color="#4fa3eb"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#304b67" opacity=".26" stroke-width="1" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="68" y="85" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="43" text-anchor="start" letter-spacing="0">DEPLOYMENT &amp; DATA FLOW</text><text x="68" y="126" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" font-size="19" text-anchor="start" letter-spacing="0">The hosted dashboard reads ThingSpeak. It does not connect to the Arduino directly.</text><rect x="71" y="156" width="245" height="36" rx="18" fill="#16344a" stroke="#3be0d1" stroke-width="1" opacity="0.9"/><text x="193.5" y="180" fill="#3be0d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">ON-SITE  /  LAPTOP</text><rect x="982" y="156" width="269" height="36" rx="18" fill="#16344a" stroke="#55aaff" stroke-width="1" opacity="0.9"/><text x="1116.5" y="180" fill="#55aaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="0">CLOUD  /  INTERNET</text><rect x="70" y="226" width="295" height="300" rx="28" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><text x="92" y="282" fill="#3be0d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="24" text-anchor="start" letter-spacing="0">ARDUINO UNO</text><rect x="465" y="226" width="342" height="300" rx="28" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><text x="487" y="282" fill="#ac93fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="24" text-anchor="start" letter-spacing="0">PYTHON BRIDGE</text><rect x="975" y="226" width="270" height="300" rx="28" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><text x="997" y="282" fill="#ffb66d" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="24" text-anchor="start" letter-spacing="0">THINGSPEAK</text><rect x="1330" y="226" width="210" height="300" rx="28" fill="#14233a" stroke="#315071" stroke-width="1.3" opacity="1"/><text x="1352" y="282" fill="#55aaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="24" text-anchor="start" letter-spacing="0">RENDER</text><text x="93" y="344" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">USB-connected sensors</text><text x="93" y="389" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Serial: 9600 baud</text><text x="93" y="431" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Local LED + buzzer</text><text x="489" y="343" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Serial reader + CSV log</text><text x="489" y="390" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="19" text-anchor="start" letter-spacing="0">HTTP write every ~20 s</text><text x="489" y="434" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Write API key (private)</text><text x="999" y="343" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">8 cloud fields</text><text x="999" y="391" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="19" text-anchor="start" letter-spacing="0">History + timestamps</text><text x="999" y="433" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Private channel</text><text x="1352" y="343" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="20" text-anchor="start" letter-spacing="0">Flask UI</text><text x="1352" y="390" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Read key</text><text x="1352" y="433" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="18" text-anchor="start" letter-spacing="0">Basic auth</text><line x1="370" y1="376" x2="459" y2="376" stroke="#3be0d1" stroke-width="4" stroke-linecap="round"/><path d="M 449 369 L 459 376 L 449 383" stroke="#3be0d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="814" y1="376" x2="969" y2="376" stroke="#3be0d1" stroke-width="4" stroke-linecap="round"/><path d="M 959 369 L 969 376 L 959 383" stroke="#3be0d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="1250" y1="376" x2="1324" y2="376" stroke="#55aaff" stroke-width="4" stroke-linecap="round"/><path d="M 1314 369 L 1324 376 L 1314 383" stroke="#55aaff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="465" y="566" width="742" height="112" rx="24" fill="#17344c" stroke="#3a849d" stroke-width="1.3" opacity="1"/><text x="836" y="609" fill="#3be0d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="24" text-anchor="middle" letter-spacing="0">CLOUD READINGS ARE NEAR REAL TIME</text><text x="836" y="647" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="middle" letter-spacing="0">Updates pause when the laptop bridge is off; stored history remains readable.</text><text x="69" y="717" fill="#adc1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" font-size="16" text-anchor="start" letter-spacing="0">Local CSV and hardware alerts continue without the hosted website.</text></svg>